plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = 'valcombe'
}

loom {
	splitEnvironmentSourceSets()
	mods {
		"valcombe" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

repositories {
	maven {
		name = 'Henkel (Simple Voice Chat)'
		url = 'https://maven.maxhenkel.de/repository/public'
	}
	exclusiveContent {
		forRepository {
			maven {
				name = 'Modrinth'
				url = 'https://api.modrinth.com/maven'
			}
		}
		filter {
			includeGroup 'maven.modrinth'
		}
	}
	// WorldEdit : dépôt officiel d'EngineHub, consulté seulement pour ses propres bibliothèques
	// (les autres dépendances de WorldEdit, comme ANTLR, viennent de Maven Central).
	maven {
		name = 'EngineHub (WorldEdit)'
		url = 'https://maven.enginehub.org/repo/'
		content {
			includeGroupAndSubgroups 'com.sk89q'
			includeGroupAndSubgroups 'org.enginehub'
		}
	}
}

dependencies {
	// Vocal de proximité : API pour compiler, mod complet pour les lancements de développement.
	compileOnly "de.maxhenkel.voicechat:voicechat-api:${project.voicechat_api_version}"
	localRuntime "maven.modrinth:simple-voice-chat:${project.voicechat_version}"

	// Construction : WorldEdit fait partie du modpack et du serveur. Son API (le cœur et l'adaptateur Fabric)
	// sert à compiler l'intégration aux ateliers, sans être incluse dans le jar ; le mod publié sur Modrinth
	// (le même fichier que celui des joueurs) est chargé par les lancements de développement et les tests en jeu.
	// Minecraft garde ses propres versions de Log4j : on n'importe pas celles que WorldEdit déclare.
	compileOnly("com.sk89q.worldedit:worldedit-core:${project.worldedit_version}") {
		exclude group: 'org.apache.logging.log4j'
	}
	compileOnly("com.sk89q.worldedit:worldedit-fabric-mc${project.minecraft_version}:${project.worldedit_version}") {
		exclude group: 'org.apache.logging.log4j'
	}
	localRuntime "maven.modrinth:worldedit:${project.worldedit_version}"

	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Mods graphiques des joueurs (installés par le launcher), pour essayer le mod avec eux :
	// ./gradlew runClient -Pgraphisme  (ou runClientGameTest -Pgraphisme)
	if (project.hasProperty('graphisme')) {
		localRuntime "maven.modrinth:sodium:mc26.3-0.9.2-fabric"
		localRuntime "maven.modrinth:iris:1.11.7+26.3-fabric"
		localRuntime "maven.modrinth:lambdynamiclights:4.13.0+26.3"
		localRuntime "maven.modrinth:continuity:3.0.1+26.3"
		localRuntime "maven.modrinth:entityculling:X1g3VhTx"
	}

	testImplementation platform('org.junit:junit-bom:5.12.2')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

test {
	useJUnitPlatform()
	testLogging {
		events "failed"
		exceptionFormat "full"
	}
}

// Tests en jeu côté client : création d'un monde, commandes, captures d'écran des écrans du mod.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "valcombe-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}
