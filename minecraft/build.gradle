plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = 'valcombe'
}

loom {
	splitEnvironmentSourceSets()
	mods {
		"valcombe" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// Les tests JUnit vérifient aussi la logique pure de l'interface haute résolution (fr.valcombe.client.hd :
// échelle des polices, défilement, édition de texte, dimensions des textures), qui ne dépend pas de Minecraft.
sourceSets {
	test {
		compileClasspath += sourceSets.client.output
		runtimeClasspath += sourceSets.client.output
	}
}

repositories {
	maven {
		name = 'Henkel (Simple Voice Chat)'
		url = 'https://maven.maxhenkel.de/repository/public'
	}
	exclusiveContent {
		forRepository {
			maven {
				name = 'Modrinth'
				url = 'https://api.modrinth.com/maven'
			}
		}
		filter {
			includeGroup 'maven.modrinth'
		}
	}
	// WorldEdit : dépôt officiel d'EngineHub, consulté seulement pour ses propres bibliothèques
	// (les autres dépendances de WorldEdit, comme ANTLR, viennent de Maven Central).
	maven {
		name = 'EngineHub (WorldEdit)'
		url = 'https://maven.enginehub.org/repo/'
		content {
			includeGroupAndSubgroups 'com.sk89q'
			includeGroupAndSubgroups 'org.enginehub'
		}
	}
	exclusiveContent {
		forRepository {
			maven {
				name = 'Nucleoid (Fantasy)'
				url = 'https://maven.nucleoid.xyz'
			}
		}
		filter {
			includeGroup 'xyz.nucleoid'
		}
	}
}

dependencies {
	// Vocal de proximité : API pour compiler, mod complet pour les lancements de développement.
	compileOnly "de.maxhenkel.voicechat:voicechat-api:${project.voicechat_api_version}"
	localRuntime "maven.modrinth:simple-voice-chat:${project.voicechat_version}"

	// Construction : WorldEdit fait partie du modpack et du serveur. Son API (le cœur et l'adaptateur Fabric)
	// sert à compiler l'intégration aux ateliers, sans être incluse dans le jar ; le mod publié sur Modrinth
	// (le même fichier que celui des joueurs) est chargé par les lancements de développement et les tests en jeu.
	// Minecraft garde ses propres versions de Log4j : on n'importe pas celles que WorldEdit déclare.
	compileOnly("com.sk89q.worldedit:worldedit-core:${project.worldedit_version}") {
		exclude group: 'org.apache.logging.log4j'
	}
	compileOnly("com.sk89q.worldedit:worldedit-fabric-mc${project.minecraft_version}:${project.worldedit_version}") {
		exclude group: 'org.apache.logging.log4j'
	}
	localRuntime "maven.modrinth:worldedit:${project.worldedit_version}"

	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Mondes persistants créés, ouverts et supprimés pendant que le serveur tourne (hub, parties, ateliers).
	// Inclus dans le jar du mod (jar-in-jar) : les joueurs et le serveur n'ont aucun mod de plus à installer.
	// Minecraft 26 n'est plus obfusqué : Loom ne remappe plus, « implementation » remplace « modImplementation ».
	implementation "xyz.nucleoid:fantasy:${project.fantasy_version}"
	include "xyz.nucleoid:fantasy:${project.fantasy_version}"

	// Mods graphiques des joueurs (installés par le launcher), pour essayer le mod avec eux :
	// ./gradlew runClient -Pgraphisme  (ou runClientGameTest -Pgraphisme)
	if (project.hasProperty('graphisme')) {
		localRuntime "maven.modrinth:sodium:mc26.3-0.9.2-fabric"
		localRuntime "maven.modrinth:iris:1.11.7+26.3-fabric"
		localRuntime "maven.modrinth:lambdynamiclights:4.13.0+26.3"
		localRuntime "maven.modrinth:continuity:3.0.1+26.3"
		localRuntime "maven.modrinth:entityculling:X1g3VhTx"
	}

	testImplementation platform('org.junit:junit-bom:5.12.2')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

test {
	useJUnitPlatform()
	// TexturesTest lit les textures du client : rejouer les tests quand elles sont redessinées
	inputs.dir("src/client/resources/assets/valcombe/textures")
	inputs.dir("src/main/resources/assets/valcombe/textures")
	inputs.file("src/main/resources/valcombe/atelier.html")
	testLogging {
		events "failed"
		exceptionFormat "full"
	}
}

// Tests en jeu côté client : création d'un monde, commandes, captures d'écran des écrans du mod.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "valcombe-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

// Vocal des lancements de développement (runClient, runServer, runClientGameTest) : jamais le port par défaut de
// Simple Voice Chat (24454), ni 25565 ou 25570 (ces trois ports sont pris par le serveur personnel), ni « -1 » (le
// port du serveur Minecraft). Avant chaque lancement, le réglage « port » du vocal de son dossier passe à 24499 s'il
// manque ou s'il vaut l'un d'eux ; les autres réglages du fichier restent tels quels.
// Le dossier est celui de la configuration de lancement de Loom (runClientGameTest : build/run/clientGameTest) : la
// tâche ne reçoit son dossier de travail qu'au moment de lancer le jeu, après ce réglage.
//
// Serveur de développement (runServer) : même règle pour le port Minecraft. Son server.properties (run/, celui du
// dossier de développement, jamais celui du serveur réel) reçoit server-port=25599 s'il manque ou vaut 25565 (le
// défaut de Minecraft), 25570 ou 24454 ; un autre port choisi à la main est gardé. Le fichier est créé au besoin
// avant le premier démarrage : Minecraft complète les autres réglages sans toucher à celui-ci.
def devVoicePort = '24499'
def forbiddenVoicePorts = ['24454', '25565', '25570', '-1']
def devServerPort = '25599'
def devTabletPort = '25598'
def forbiddenServerPorts = ['24454', '25565', '25570']
tasks.withType(JavaExec).matching { it.name.startsWith('run') && it.name.length() > 3 }.configureEach { t ->
	def runName = t.name.substring(3, 4).toLowerCase() + t.name.substring(4)
	def runDir = providers.provider {
		def run = loom.runs.findByName(runName)
		run == null ? null : file(run.runDir)
	}
	if (runName == 'server') {
		t.doFirst { task ->
			def dir = runDir.getOrNull() ?: task.workingDir
			def props = new File(dir, 'server.properties')
			def lines = props.exists() ? props.readLines('UTF-8') : []
			int at = lines.findIndexOf { it.trim().startsWith('server-port=') }
			def current = at >= 0 ? lines[at].trim().substring('server-port='.length()).trim() : ''
			if (at >= 0 && !current.isEmpty() && !forbiddenServerPorts.contains(current)) {
				return
			}
			if (at >= 0) {
				lines[at] = "server-port=${devServerPort}".toString()
			} else {
				lines << "server-port=${devServerPort}".toString()
			}
			props.parentFile.mkdirs()
			props.write(lines.join('\n') + '\n', 'UTF-8')
			task.logger.lifecycle("Serveur de développement : port ${devServerPort} ({})", props)
		}
	}
	// Le serveur web du mod (tablette, Atelier, API d'administration) écoute par défaut sur 25570, pris lui aussi sur ce
	// PC : les lancements de développement (serveur, ou serveur intégré du client) prennent 25598, dans le
	// config/valcombe-communaute.json de leur dossier ; les autres réglages sont gardés, et un port choisi à la main
	// aussi s'il n'est pas interdit.
	t.doFirst { task ->
		def dir = runDir.getOrNull() ?: task.workingDir
		def cfg = new File(dir, 'config/valcombe-communaute.json')
		def json = cfg.exists() ? new groovy.json.JsonSlurper().parse(cfg, 'UTF-8') : [:]
		def port = json instanceof Map && json.tabletPort != null ? json.tabletPort.toString() : ''
		if (!port.isEmpty() && !forbiddenServerPorts.contains(port)) {
			return
		}
		def out = json instanceof Map ? new LinkedHashMap(json) : [:]
		out.tabletPort = (devTabletPort as int)
		cfg.parentFile.mkdirs()
		cfg.write(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(out)) + '\n', 'UTF-8')
		task.logger.lifecycle("Lancement de développement : tablette et API sur le port ${devTabletPort} ({})", cfg)
	}
	t.doFirst { task ->
		def dir = runDir.getOrNull() ?: task.workingDir
		def props = new File(dir, 'config/voicechat/voicechat-server.properties')
		def lines = props.exists() ? props.readLines('UTF-8') : []
		int at = lines.findIndexOf { it.trim().startsWith('port=') }
		if (at >= 0 && !forbiddenVoicePorts.contains(lines[at].trim().substring(5).trim())) {
			return
		}
		if (at >= 0) {
			lines[at] = "port=${devVoicePort}".toString()
		} else {
			lines << "port=${devVoicePort}".toString()
		}
		props.parentFile.mkdirs()
		props.write(lines.join('\n') + '\n', 'UTF-8')
		task.logger.lifecycle("Vocal de développement : port ${devVoicePort} ({})", props)
	}
}
