plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base {
	archivesName = 'valcombe'
}

loom {
	splitEnvironmentSourceSets()
	mods {
		"valcombe" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// Les tests JUnit vérifient aussi la logique pure de l'interface haute résolution (fr.valcombe.client.hd :
// échelle des polices, défilement, édition de texte, dimensions des textures), qui ne dépend pas de Minecraft.
sourceSets {
	test {
		compileClasspath += sourceSets.client.output
		runtimeClasspath += sourceSets.client.output
	}
}

repositories {
	maven {
		name = 'Henkel (Simple Voice Chat)'
		url = 'https://maven.maxhenkel.de/repository/public'
	}
	exclusiveContent {
		forRepository {
			maven {
				name = 'Modrinth'
				url = 'https://api.modrinth.com/maven'
			}
		}
		filter {
			includeGroup 'maven.modrinth'
		}
	}
}

dependencies {
	// Vocal de proximité : API pour compiler, mod complet pour les lancements de développement.
	compileOnly "de.maxhenkel.voicechat:voicechat-api:${project.voicechat_api_version}"
	localRuntime "maven.modrinth:simple-voice-chat:${project.voicechat_version}"

	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Mods graphiques des joueurs (installés par le launcher), pour essayer le mod avec eux :
	// ./gradlew runClient -Pgraphisme  (ou runClientGameTest -Pgraphisme)
	if (project.hasProperty('graphisme')) {
		localRuntime "maven.modrinth:sodium:mc26.3-0.9.2-fabric"
		localRuntime "maven.modrinth:iris:1.11.7+26.3-fabric"
		localRuntime "maven.modrinth:lambdynamiclights:4.13.0+26.3"
		localRuntime "maven.modrinth:continuity:3.0.1+26.3"
		localRuntime "maven.modrinth:entityculling:X1g3VhTx"
	}

	testImplementation platform('org.junit:junit-bom:5.12.2')
	testImplementation 'org.junit.jupiter:junit-jupiter'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
	def version = project.version
	inputs.property "version", version
	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = 'UTF-8'
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

test {
	useJUnitPlatform()
	testLogging {
		events "failed"
		exceptionFormat "full"
	}
}

// Tests en jeu côté client : création d'un monde, commandes, captures d'écran des écrans du mod.
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "valcombe-gametest"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}
