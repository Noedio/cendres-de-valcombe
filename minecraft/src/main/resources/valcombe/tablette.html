<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Grimoire de Valcombe</title>
<style>
	:root {
		--bg: #140d10;
		--panel: #22161a;
		--panel-2: #2c1d22;
		--line: #4a3238;
		--ink: #efe3c8;
		--muted: #b8a68a;
		--gold: #d9b45a;
		--wine: #7a2433;
		--good: #5a8fd6;
		--evil: #d0484a;
		--ok: #6fb37a;
		--radius: 12px;
	}
	* { box-sizing: border-box; }
	html, body { margin: 0; background: var(--bg); color: var(--ink); }
	body {
		font: 16px/1.4 Georgia, "Times New Roman", serif;
		padding: 12px 16px calc(24px + env(safe-area-inset-bottom));
		max-width: 1100px;
		margin: 0 auto;
	}
	header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
	h1 { font-size: 1.3rem; margin: 4px 0; color: var(--gold); letter-spacing: .02em; }
	.phase { font-size: 1.05rem; color: var(--muted); }
	.state { font-size: .85rem; color: var(--muted); }
	.state.off { color: var(--evil); }
	section { margin-top: 14px; }
	h2 { font-size: .8rem; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin: 0 0 8px; font-weight: normal; }
	.bar { display: flex; flex-wrap: wrap; gap: 8px; }
	button {
		font: inherit; color: var(--ink); background: var(--panel-2); border: 1px solid var(--line);
		border-radius: 10px; padding: 10px 14px; min-height: 44px; cursor: pointer;
	}
	button:active { transform: translateY(1px); }
	button.main { background: var(--wine); border-color: #a3404f; }
	button.danger { border-color: var(--evil); color: #ffd7d7; }
	button.sel { outline: 2px solid var(--gold); }
	button:disabled { opacity: .45; cursor: default; }
	.card {
		background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px;
	}
	.prompt { border-color: var(--gold); }
	.prompt .title { color: var(--gold); font-size: 1.1rem; margin-bottom: 4px; }
	.prompt .text { white-space: pre-wrap; margin-bottom: 10px; }
	.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
	.seat { position: relative; cursor: pointer; text-align: left; width: 100%; }
	.seat .name { font-size: 1.05rem; font-weight: bold; }
	.seat .role { margin-top: 2px; }
	.seat .role.GOOD { color: var(--good); }
	.seat .role.EVIL { color: var(--evil); }
	.seat .believed { color: var(--muted); font-size: .85rem; }
	.seat .line { color: var(--muted); font-size: .85rem; margin-top: 4px; }
	.seat.dead { opacity: .6; }
	.seat.dead .name::before { content: "✝ "; }
	.seat.nominee { border-color: var(--gold); }
	.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
	.chip { font-size: .72rem; padding: 2px 7px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
	.chip.poison { border-color: #8e5bd6; color: #cbb0f2; }
	.chip.protect { border-color: var(--ok); color: #bfe6c5; }
	.chip.herring { border-color: var(--gold); color: var(--gold); }
	.chip.ghost { border-color: var(--good); color: #c9dcf6; }
	.feed { font-size: .9rem; color: var(--muted); }
	.feed div { padding: 3px 0; border-bottom: 1px solid #2a1d21; }
	.sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: none; align-items: flex-end; justify-content: center; z-index: 5; }
	.sheet-bg.open { display: flex; }
	.sheet { background: var(--panel); border: 1px solid var(--line); border-radius: 16px 16px 0 0; padding: 16px; width: 100%; max-width: 560px;
		padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
	.sheet h3 { margin: 0 0 4px; color: var(--gold); }
	.sheet .bar button { flex: 1 1 140px; }
	.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #000d; color: var(--ink); border: 1px solid var(--line);
		padding: 10px 14px; border-radius: 10px; max-width: calc(100% - 32px); white-space: pre-wrap; display: none; z-index: 9; }
	.toast.show { display: block; }
	.vote { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
	.meter { height: 6px; background: #3a2a2e; border-radius: 3px; overflow: hidden; margin-top: 8px; }
	.meter i { display: block; height: 100%; background: var(--gold); }
	.empty { color: var(--muted); font-style: italic; }
	.pause { background: var(--gold); color: #201408; border-radius: 10px; padding: 8px 12px; margin-top: 10px; font-weight: bold; }
	.order { font-size: .92rem; }
	.order div { padding: 3px 6px; border-radius: 6px; }
	.order .done { color: var(--muted); }
	.order .now { background: #3a2a14; color: var(--gold); font-weight: bold; }
	.alert { color: #ffb4a8; margin: 4px 0; }
	.todo { margin: 8px 0; }
	.tray h4 { margin: 10px 0 4px; font-size: .78rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); font-weight: normal; }
	.tray h4.evil { color: var(--evil); }
	.tray button { min-height: 36px; padding: 6px 10px; font-size: .9rem; }
	.journal { max-height: 320px; overflow-y: auto; font-size: .88rem; }
	.journal div { padding: 2px 0; }
	.journal .head { color: var(--gold); margin-top: 6px; }
	.sheet { max-height: 88vh; overflow-y: auto; }
	.warn { color: var(--gold); font-size: .9rem; margin-top: 6px; }
	@media (min-width: 900px) { .cols { display: grid; grid-template-columns: 2fr 1fr; gap: 16px; } }
</style>
</head>
<body>
<header>
	<h1>Grimoire de Valcombe</h1>
	<div class="phase" id="phase">Connexion…</div>
</header>
<div class="state" id="state"></div>

<div class="pause" id="pauseBox" hidden>Partie en pause</div>
<section id="promptBox" hidden></section>
<section id="voteBox" hidden></section>
<section id="nightBox" hidden>
	<h2>Nuit pas à pas</h2>
	<div class="cols">
		<div class="card" id="stepCard"></div>
		<div class="card order" id="nightOrder"></div>
	</div>
</section>

<section>
	<h2>Conduite</h2>
	<div class="bar" id="controls"></div>
</section>

<div class="cols">
	<section>
		<h2>Cercle</h2>
		<div class="grid" id="seats"></div>
		<div class="warn" id="dist"></div>
	</section>
	<section>
		<h2>Fil de la partie</h2>
		<div class="card feed" id="feed"></div>
		<h2 style="margin-top:14px">Journal du Conteur</h2>
		<div class="bar" id="journalBar" style="margin-bottom:8px"></div>
		<div class="card journal" id="journal"></div>
	</section>
</div>

<div class="sheet-bg" id="sheetBg">
	<div class="sheet">
		<h3 id="sheetName"></h3>
		<div class="state" id="sheetRole"></div>
		<div class="bar" id="sheetActions" style="margin-top:12px"></div>
		<div class="tray" id="sheetTray"></div>
	</div>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
function readToken() {
	const fromLink = decodeURIComponent(location.hash.slice(1));
	try {
		if (fromLink) sessionStorage.setItem("valcombe-jeton", fromLink);
		else return sessionStorage.getItem("valcombe-jeton") || "";
	} catch (e) { /* stockage indisponible : on garde le lien tel quel */ return fromLink; }
	// Le jeton reste dans l'onglet : on l'enlève de la barre d'adresse.
	history.replaceState(null, "", location.pathname);
	return fromLink;
}
const token = readToken();
let view = null;
let toastTimer = 0;
let journalSection = -1;
let armed = "";

function el(tag, cls, text) {
	const e = document.createElement(tag);
	if (cls) e.className = cls;
	if (text !== undefined && text !== null) e.textContent = text;
	return e;
}
function btn(label, cmd, cls) {
	const b = el("button", cls || "", label);
	b.addEventListener("click", (ev) => { ev.stopPropagation(); send(cmd); });
	return b;
}
function toast(text) {
	const t = document.getElementById("toast");
	t.textContent = text;
	t.classList.add("show");
	clearTimeout(toastTimer);
	toastTimer = setTimeout(() => t.classList.remove("show"), 3500);
}

async function send(cmd) {
	closeSheet();
	try {
		const r = await fetch("/api/commande", { method: "POST", headers: { "X-Valcombe-Jeton": token }, body: cmd });
		const text = await r.text();
		if (text) toast(text);
	} catch (e) {
		toast("Pas de réponse du serveur.");
	}
	refresh();
}

async function refresh() {
	try {
		const r = await fetch("/api/vue", { headers: { "X-Valcombe-Jeton": token } });
		if (!r.ok) {
			setState(await r.text(), true);
			return;
		}
		view = await r.json();
		render();
	} catch (e) {
		setState("Serveur injoignable, nouvel essai…", true);
	}
}

function setState(text, bad) {
	const s = document.getElementById("state");
	s.textContent = text;
	s.className = "state" + (bad ? " off" : "");
}

function phaseLabel(v) {
	switch (v.phase) {
		case "NIGHT": return "Nuit " + v.night;
		case "DAY": return "Jour " + v.day + (v.dayOver ? " — terminé" : "");
		case "READY": return "La partie va commencer";
		default: return "Salon : " + (v.lobby || []).length + " inscrit(s)";
	}
}

function render() {
	const v = view;
	document.getElementById("phase").textContent = phaseLabel(v);
	setState((v.online ? "Connecté en tant que " : "Hors jeu : ") + v.me
		+ (v.storyteller ? " · Conteur : " + v.storyteller : " · Conteur automatique")
		+ (v.online ? "" : " — connectez-vous au jeu pour agir"), !v.online);
	document.getElementById("pauseBox").hidden = !v.paused;
	renderPrompt(v);
	renderVote(v);
	renderNight(v);
	renderJournal(v);
	renderControls(v);
	renderSeats(v);
	const feed = document.getElementById("feed");
	feed.replaceChildren();
	const lines = (v.feed || []).slice().reverse();
	if (!lines.length) feed.append(el("div", "empty", "Rien pour l'instant."));
	for (const line of lines) feed.append(el("div", "", line));
	document.getElementById("dist").textContent = v.distWarning || "";
}

function renderPrompt(v) {
	const box = document.getElementById("promptBox");
	const p = v.prompt;
	box.replaceChildren();
	if (!p || p.type === "grimoire") { box.hidden = true; return; }
	box.hidden = false;
	const card = el("div", "card prompt");
	card.append(el("div", "title", p.title || (p.type === "vote" ? "Vote" : "Action")));
	const bar = el("div", "bar");
	if (p.type === "decide") {
		card.append(el("div", "text", p.question));
		p.options.forEach((o, i) => bar.append(btn(o, "vc decider " + i, i === 0 ? "main" : "")));
	} else if (p.type === "confirm") {
		card.append(el("div", "text", "Pour " + p.to + " : " + p.text + (p.truth ? "\n(vérité : " + p.truth + ")" : "")));
		bar.append(btn("Envoyer", "vc envoyer", "main"));
		const edit = el("button", "", "Modifier avant l'envoi");
		edit.addEventListener("click", () => {
			const text = window.prompt("Information envoyée à " + p.to + " :", p.text);
			if (text && text.trim()) send("vc envoyer " + text.trim().slice(0, 300));
		});
		bar.append(edit);
	} else if (p.type === "choose") {
		card.append(el("div", "text", "Choisir " + p.count + " joueur(s)."
			+ (p.optional ? " Pouvoir à usage unique : valider sans personne le garde pour une autre nuit." : "")));
		for (const o of p.options) bar.append(btn(o.name, "vc choisir " + o.name, o.selected ? "sel" : ""));
		bar.append(btn("Valider", "vc valider", "main"));
	} else if (p.type === "info") {
		card.append(el("div", "text", p.text));
		bar.append(btn("Je me rendors", "vc dormir", "main"));
	} else if (p.type === "vote") {
		card.append(el("div", "text", "Vote sur " + p.nominee));
	}
	card.append(bar);
	box.append(card);
}

function renderVote(v) {
	const box = document.getElementById("voteBox");
	box.replaceChildren();
	const vote = v.vote;
	if (!vote) { box.hidden = true; return; }
	box.hidden = false;
	const card = el("div", "card");
	const row = el("div", "vote");
	const defense = vote.stage === "DEFENSE";
	row.append(el("div", "", defense
		? vote.nominee + " (accusé par " + vote.nominator + ") se défend — " + vote.defenseLeft + " s"
		: "Vote sur " + vote.nominee + " : " + vote.count + " voix, seuil " + vote.threshold));
	if (defense) row.append(btn("Passer au vote", "vc voter", "main"));
	row.append(btn("Annuler le vote", "vc vote annuler"));
	card.append(row);
	if (!defense) {
		const m = el("div", "meter");
		const i = el("i");
		i.style.width = Math.min(100, 100 * vote.count / Math.max(1, vote.threshold)) + "%";
		m.append(i);
		card.append(m);
	}
	box.append(card);
}

function renderControls(v) {
	const c = document.getElementById("controls");
	c.replaceChildren();
	if (v.phase === "LOBBY") {
		c.append(btn("Lancer (Conteur humain)", "vc lancer humain", "main"), btn("Lancer (automatique)", "vc lancer auto"));
		c.append(btn("Mélanger les places", "vc melanger"));
		if (v.lobbyStatus) c.append(el("div", v.lobbyReady ? "state" : "state off", v.lobbyStatus));
		return;
	}
	if (v.phase === "READY") c.append(btn("Faire tomber la nuit", "vc nuit", "main"));
	if (v.phase === "NIGHT") {
		c.append(btn("Étape précédente", "vc precedent"));
		c.append(btn("Étape suivante", "vc suivant", "main"));
	}
	if (v.phase === "DAY") {
		const block = v.today && v.today.block;
		c.append(btn("Rassembler", "vc rassembler"));
		c.append(btn("Discussion 5 min", "vc discussion 5"));
		c.append(btn("+1 minute", "vc prolonger 1"));
		c.append(v.nominationsOpen ? btn("Fermer les nominations", "vc nominations fermer") : btn("Ouvrir les nominations", "vc nominations ouvrir", "main"));
		if (block && !v.vote) c.append(btn("Gracier " + block, "vc gracier"));
		c.append(btn(block ? "Exécuter " + block + " et clore le jour" : "Clore la journée", "vc finjour"));
		if (v.dayOver) c.append(btn("Faire tomber la nuit", "vc nuit", "main"));
		c.append(btn("Parole au suivant", "vc parole suivant"));
		c.append(btn("Tour de table", "vc parole tour"));
		if (v.speech) c.append(btn("Arrêter la parole", "vc parole stop"));
		c.append(btn(v.broadcast ? "Ma voix : à tous" : "Ma voix : proximité", "vc diffusion"));
	}
	c.append(btn(v.paused ? "Reprendre" : "Pause", "vc pause", v.paused ? "main" : ""));
	c.append(confirmBtn("Victoire du bien", "vc victoire bien"));
	c.append(confirmBtn("Victoire du mal", "vc victoire mal"));
	c.append(confirmBtn("Arrêter la partie", "vc arreter"));
	if (v.speech) {
		c.append(el("div", "state", "Parole : " + (v.speech.speaker || "personne")
			+ (v.speech.queue.length ? " — demandent : " + v.speech.queue.join(", ") : "")));
	}
}

// Bouton à confirmer : le premier appui l'arme, le second lance la commande.
function confirmBtn(label, cmd) {
	const on = armed === cmd;
	const b = el("button", "danger", on ? "Confirmer : " + label : label);
	b.addEventListener("click", () => {
		if (on) { armed = ""; send(cmd); } else { armed = cmd; render(); }
	});
	return b;
}

function renderNight(v) {
	const box = document.getElementById("nightBox");
	const order = v.nightOrder;
	if (v.phase !== "NIGHT" || !order) { box.hidden = true; return; }
	box.hidden = false;
	const list = document.getElementById("nightOrder");
	list.replaceChildren();
	if (!order.length) list.append(el("div", "empty", "Plus aucun réveil."));
	for (const e of order) {
		const mark = e.state === 0 ? "▶ " : e.state < 0 ? "✔ " : "· ";
		list.append(el("div", e.state === 0 ? "now" : e.state < 0 ? "done" : "", mark + e.title + (e.player ? " — " + e.player : "")));
	}
	const card = document.getElementById("stepCard");
	card.replaceChildren();
	const ns = v.nightStep;
	if (!ns) { card.append(el("div", "empty", "Aucune étape en cours.")); return; }
	card.append(el("div", "title", ns.title + (ns.player ? " — " + ns.player : "")));
	if (ns.waiting) card.append(el("div", "state", "On attend : " + ns.waiting));
	for (const a of ns.alerts || []) card.append(el("div", "alert", "⚠ " + a));
	card.append(el("div", "todo", ns.todo || ""));
	if (ns.player) {
		const bar = el("div", "bar");
		const awake = (v.awake || []).includes(ns.player);
		bar.append(btn(awake ? "Rendormir" : "Réveiller", (awake ? "vc rendormir " : "vc reveiller ") + ns.player));
		bar.append(btn("Demander 1 joueur", "vc demander " + ns.player + " 1"));
		bar.append(btn("Demander 2 joueurs", "vc demander " + ns.player + " 2"));
		const show = el("button", "", "Montrer…");
		show.addEventListener("click", () => showTo(ns.player));
		bar.append(show);
		const sheet = el("button", "", "Fiche et jetons");
		sheet.addEventListener("click", () => openByName(ns.player));
		bar.append(sheet);
		card.append(bar);
	}
}

function showTo(name) {
	const text = window.prompt("Information à montrer à " + name + " (oui, non, un nombre, un nom, un rôle…) :");
	if (text && text.trim()) send("vc montrer " + name + " " + text.trim().slice(0, 200));
}

function openByName(name) {
	const s = (view.seats || []).find(x => x.name === name);
	const g = (view.grimoire || []).find(x => x.name === name);
	if (s) openSheet(s, g);
}

function isHead(line) {
	return line.startsWith("La nuit ") || line.startsWith("Le jour ") || line.startsWith("Mise en place");
}

function renderJournal(v) {
	const box = document.getElementById("journal");
	const bar = document.getElementById("journalBar");
	const keepScroll = box.scrollTop;
	box.replaceChildren();
	bar.replaceChildren();
	const lines = v.journal || [];
	if (!lines.length) { box.append(el("div", "empty", "Le journal s'écrit pendant la partie.")); return; }
	const heads = lines.filter(isHead);
	if (journalSection >= heads.length) journalSection = -1;
	const all = el("button", journalSection < 0 ? "sel" : "", "Tout");
	all.addEventListener("click", () => { journalSection = -1; render(); });
	bar.append(all);
	heads.forEach((h, i) => {
		const label = h.startsWith("Mise") ? "Mise en place" : h.replace(" tombe.", "").replace(" se lève.", "").replace("La nuit", "Nuit").replace("Le jour", "Jour");
		const b = el("button", journalSection === i ? "sel" : "", label);
		b.addEventListener("click", () => { journalSection = i; render(); });
		bar.append(b);
	});
	let index = -1;
	for (const line of lines) {
		const head = isHead(line);
		if (head) index++;
		if (journalSection >= 0 && index !== journalSection) continue;
		box.append(el("div", head ? "head" : "", line));
	}
	box.scrollTop = keepScroll;
	if (v.gameNote) box.prepend(el("div", "alert", "Note de partie : " + v.gameNote));
}

function renderSeats(v) {
	const box = document.getElementById("seats");
	box.replaceChildren();
	const seats = v.seats || [];
	if (!seats.length) {
		const names = v.lobby || [];
		if (!names.length) box.append(el("div", "empty", "Personne n'est inscrit."));
		for (const n of names) {
			const card = el("div", "card seat");
			card.append(el("div", "name", n));
			if ((v.bots || []).includes(n)) card.append(el("div", "line", "joueur fictif"));
			box.append(card);
		}
		return;
	}
	const grim = {};
	for (const g of v.grimoire || []) grim[g.seat] = g;
	const nominee = v.vote ? v.vote.nominee : null;
	for (const s of seats) {
		const g = grim[s.seat];
		const card = el("button", "card seat" + (s.alive ? "" : " dead") + (s.name === nominee ? " nominee" : ""));
		card.append(el("div", "name", s.name));
		if (g) {
			card.append(el("div", "role " + g.role.team, g.role.name));
			if (g.believed) card.append(el("div", "believed", "croit être " + g.believed.name));
			// La ligne du grimoire répète nom et rôle : on n'en garde que les marqueurs [ivre], [empoisonné]…
			const marks = (g.line || "").match(/\[[^\]]*\]/g);
			if (marks) card.append(el("div", "line", marks.join(" ")));
			if (g.note) card.append(el("div", "line", "Note : " + g.note));
		}
		const chips = el("div", "chips");
		if (g && g.poisoned) chips.append(el("span", "chip poison", "empoisonné"));
		if (g && g.protected) chips.append(el("span", "chip protect", "protégé"));
		if (g && g.redHerring) chips.append(el("span", "chip herring", "fausse piste"));
		if (g && g.master) chips.append(el("span", "chip", "maître"));
		if (!s.alive) chips.append(el("span", "chip ghost", s.ghostVote ? "vote de fantôme" : "vote utilisé"));
		if (s.bot) chips.append(el("span", "chip", "fictif"));
		if (s.standIn) chips.append(el("span", "chip ghost", "relayé"));
		else if ((v.absents || []).includes(s.name)) chips.append(el("span", "chip poison", "déconnecté"));
		const said = v.answers && v.answers[s.name];
		if (said && said.length) chips.append(el("span", "chip", "a désigné : " + said.join(", ")));
		for (const r of (g && g.reminders) || []) chips.append(el("span", "chip herring", r));
		if (chips.childElementCount) card.append(chips);
		card.addEventListener("click", () => openSheet(s, g));
		box.append(card);
	}
}

function openSheet(s, g) {
	document.getElementById("sheetName").textContent = s.name;
	document.getElementById("sheetRole").textContent = g ? g.role.name + " — " + g.role.text : "";
	const a = document.getElementById("sheetActions");
	a.replaceChildren();
	if (s.alive) a.append(btn("Tuer", "vc tuer " + s.name, "danger"));
	else a.append(btn("Ressusciter", "vc ressusciter " + s.name));
	if (!(g && g.poisoned)) a.append(btn("Empoisonner", "vc empoisonner " + s.name));
	a.append(btn("Demander 1 joueur", "vc demander " + s.name + " 1"));
	const show = el("button", "", "Montrer…");
	show.addEventListener("click", () => { closeSheet(); showTo(s.name); });
	a.append(show);
	if (view.phase === "NIGHT") {
		const awake = (view.awake || []).includes(s.name);
		a.append(btn(awake ? "Rendormir" : "Réveiller", (awake ? "vc rendormir " : "vc reveiller ") + s.name));
	} else if (view.phase === "DAY") {
		a.append(btn("Donner la parole", "vc parole donner " + s.name));
	}
	if ((view.absents || []).includes(s.name) && !s.standIn) a.append(btn("Le faire relayer", "vc relayer " + s.name, "main"));
	const note = el("button", "", "Note");
	note.addEventListener("click", () => {
		const text = window.prompt("Note sur " + s.name + " (vide : effacer) :", (g && g.note) || "");
		if (text !== null) send(("vc note " + s.name + " " + text.trim().slice(0, 200)).trim());
	});
	a.append(note);
	// Jetons de rappel : ceux des rôles en jeu, puis les jetons communs ; un appui pose ou retire.
	const tray = document.getElementById("sheetTray");
	tray.replaceChildren();
	const worn = (g && g.reminders) || [];
	for (const group of view.tokens || []) {
		tray.append(el("h4", group.evil ? "evil" : "", group.role));
		const bar = el("div", "bar");
		for (const item of group.items) {
			const on = worn.includes(item);
			bar.append(btn((on ? "✔ " : "") + item, "vc rappel " + s.name + " " + (on ? "retirer " : "") + item, on ? "sel" : ""));
		}
		tray.append(bar);
	}
	const remind = el("button", "", "Autre rappel…");
	remind.addEventListener("click", () => {
		const text = window.prompt("Rappel sur " + s.name + " (ex. a choisi Bot3) :");
		if (text && text.trim()) send("vc rappel " + s.name + " " + text.trim().slice(0, 40));
	});
	a.append(remind);
	if (worn.length) a.append(btn("Effacer les rappels", "vc rappel " + s.name + " effacer"));
	const close = el("button", "", "Fermer");
	close.addEventListener("click", closeSheet);
	a.append(close);
	document.getElementById("sheetBg").classList.add("open");
}
function closeSheet() {
	document.getElementById("sheetBg").classList.remove("open");
}
document.getElementById("sheetBg").addEventListener("click", (e) => { if (e.target.id === "sheetBg") closeSheet(); });

if (!token) {
	setState("Lien incomplet : relancez /vc tablette dans le jeu.", true);
} else {
	refresh();
	setInterval(refresh, 1500);
}
</script>
