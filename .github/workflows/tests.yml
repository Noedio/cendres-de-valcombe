name: Tests

# Lance les tests du moteur de règles et de la table de jeu à chaque envoi,
# et vérifie que le launcher compile.
on:
  push:
  pull_request:

jobs:
  mod:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: minecraft
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle
      - name: Tests et compilation du mod
        run: ./gradlew build --no-daemon
      - name: Résultats des tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultats-tests
          path: minecraft/build/reports/tests/test

  launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Compilation du launcher
        run: dotnet build launcher/ValcombeLauncher.csproj -c Release
